name: Build AMRPC APK

on:
  push:
    paths:
      - ".github/workflows/main.yml"
      - "amrpc.zip"
      - "amrpc/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          with zipfile.ZipFile("amrpc.zip") as archive:
              for entry in archive.infolist():
                  path = Path(entry.filename)
                  if (
                      path.is_absolute()
                      or ".." in path.parts
                      or path.parts[0] != "amrpc"
                  ):
                      raise ValueError("Unsafe archive path")
                  if entry.external_attr >> 16 & 0o170000 == 0o120000:
                      raise ValueError("Symlinks not allowed")
              archive.extractall(".")

          print("Project extracted successfully")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android components
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"

          SDKMGR=$(ls -d "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)
          if [ -z "${SDKMGR}" ]; then
            echo "sdkmanager not found on runner"
            exit 1
          fi
          echo "Using ${SDKMGR}"

          mkdir -p "${ANDROID_HOME}/licenses"
          printf "\n24333f8a63b6825ea Becf4147559D29A54E5F00A5\n" > "${ANDROID_HOME}/licenses/android-sdk-license"
          printf "\n84831b9409646a918E34935899E76F2C21B742D3\n" > "${ANDROID_HOME}/licenses/android-sdk-preview-license"

          yes "${SDKMGR}" --licenses > /dev/null 2>&1 || true

          "${SDKMGR}" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        working-directory: amrpc
        shell: bash
        run: |
          if [ -x ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: amrpc-debug-apk
          path: amrpc/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
